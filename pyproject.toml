[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-predict"
version = "0.3.0"
description = "A robust LazyPredict-style automated model comparison library for classification and regression."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Santu Chall", email = "santuchal@gmail.com"}]
keywords = ["automl", "machine-learning", "model-selection", "classification", "regression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "joblib>=1.2",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
boost = [
  "xgboost>=1.7",
  "lightgbm>=4.0",
  "catboost>=1.2",
]
viz = [
  "matplotlib>=3.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
  "jupyter>=1.0",
  "nbformat>=5.10",
  "nbclient>=0.10",
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
]
all = [
  "xgboost>=1.7",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "matplotlib>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

[project.urls]
Homepage = "https://github.com/santuchal/all_predict"
Repository = "https://github.com/santuchal/all_predict"
Issues = "https://github.com/santuchal/all_predict/issues"

[project.scripts]
all-predict = "all_predict.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["all_predict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
